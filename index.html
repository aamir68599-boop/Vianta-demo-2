<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vianta Saree · Silk & Heritage</title>
  <!-- Font Awesome 5 (free) -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: #f9f5f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      width: 100%;
    }

    .wrapper {
      max-width: 1440px;
      width: 100%;
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
      padding: 0 2rem 2rem 2rem;
      border-radius: 0 0 2rem 2rem;
    }

    /* ---- OFFER BANNER (lightweight, professional, subtle) ---- */
    .offer-banner {
      background: transparent;
      color: #2c1810;
      text-align: center;
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
      letter-spacing: 0.4px;
      border-radius: 40px;
      margin-top: 0.5rem;
      margin-bottom: 0.1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-weight: 400;
      border: 1px solid #e8dfd9;
      background: #fcf8f5;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
    }
    .offer-banner strong {
      font-weight: 500;
      color: #a67c6b;
      background: transparent;
      padding: 0 0.2rem;
      letter-spacing: 0.8px;
      font-size: 0.85rem;
    }
    .offer-banner i {
      color: #b8a69b;
      margin: 0 0.1rem;
      font-size: 0.7rem;
    }
    .offer-banner span {
      background: transparent;
      padding: 0.1rem 0.5rem;
      border-radius: 30px;
      color: #3d2c24;
      font-weight: 400;
      font-size: 0.8rem;
      border: 1px solid #e8dfd9;
      background: #ffffff;
    }
    .offer-banner .highlight {
      background: #f3ede8;
      color: #2c1810;
      border-color: #ddd2ca;
    }
    .offer-banner .sep {
      color: #d6c9c0;
      font-size: 0.6rem;
    }

    /* ---- TOP HEADER : simplified, clean, professional ---- */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0 0.2rem 0;
      border-bottom: 1px solid #f0ebe6;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-icon {
      background: #a67c6b;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 2px 6px rgba(166, 124, 107, 0.2);
    }

    .brand h1 {
      font-size: 1.7rem;
      font-weight: 400;
      letter-spacing: 1px;
      color: #2c1810;
    }
    .brand h1 span {
      font-weight: 300;
      color: #a67c6b;
    }

    .top-icons {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      color: #2c1810;
      font-size: 1.1rem;
    }
    .top-icons i {
      cursor: default;
      transition: color 0.2s, transform 0.2s;
    }
    .top-icons i:hover {
      color: #a67c6b;
      transform: scale(1.05);
    }

    /* search field – clean & minimal */
    .search-wrap {
      display: flex;
      align-items: center;
      background: #f3ede8;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      gap: 0.4rem;
      border: 1px solid #e2d6ce;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .search-wrap:focus-within {
      border-color: #a67c6b;
      box-shadow: 0 0 0 3px rgba(166, 124, 107, 0.1);
    }
    .search-wrap i {
      color: #6b5a4f;
      font-size: 0.85rem;
    }
    .search-wrap input {
      border: none;
      background: transparent;
      padding: 0.25rem 0;
      font-size: 0.85rem;
      width: 110px;
      outline: none;
      color: #2c1810;
    }
    .search-wrap input::placeholder {
      color: #ab988b;
      font-weight: 300;
    }

    /* ---- BOTTOM HEADER : menu (centered, elegant) ---- */
    .bottom-header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.7rem 0 0.4rem 0;
      flex-wrap: wrap;
      border-bottom: 1px solid #f0ebe6;
    }

    .main-menu {
      display: flex;
      gap: 2.2rem;
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #2c1810;
      flex-wrap: wrap;
      justify-content: center;
    }
    .main-menu a {
      text-decoration: none;
      color: inherit;
      transition: color 0.2s;
      position: relative;
      padding: 0.1rem 0;
    }
    .main-menu a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0%;
      height: 2px;
      background: #a67c6b;
      transition: width 0.25s ease;
    }
    .main-menu a:hover {
      color: #a67c6b;
    }
    .main-menu a:hover::after {
      width: 100%;
    }

    .more-dropdown {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      cursor: default;
      color: #2c1810;
      font-weight: 500;
    }
    .more-dropdown i {
      font-size: 0.65rem;
      margin-left: 0.1rem;
      color: #7a685c;
    }

    /* hide old extra */
    .header-extra {
      display: none;
    }

    /* ===== HERO CAROUSEL (full cover, image full view) ===== */
    .hero-carousel {
      margin-top: 1.5rem;
      position: relative;
      width: 100%;
      height: calc(100vh - 240px);
      min-height: 420px;
      max-height: 800px;
      background: #fcf8f5;
      border-radius: 2rem;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.02);
    }

    .carousel-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .carousel-slide.active-slide {
      opacity: 1;
      pointer-events: auto;
    }

    .slide-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-image {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      border-radius: 2rem;
      background: #fcf8f5;
    }

    /* carousel controls */
    .carousel-controls {
      position: absolute;
      bottom: 1.8rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      z-index: 10;
      padding: 0 1rem;
    }

    .carousel-btn {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #d6c9c0;
      width: 44px;
      height: 44px;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #2c1810;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(2px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .carousel-btn:hover {
      background: #2c1810;
      color: white;
      border-color: #2c1810;
    }

    .carousel-indicators {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.6);
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 0;
    }
    .dot.active {
      background: #2c1810;
      width: 24px;
      border-color: #2c1810;
    }

    /* ---- responsive ---- */
    @media screen and (max-width: 860px) {
      .wrapper {
        padding: 0 1rem 1.5rem 1rem;
      }
      .main-menu {
        gap: 1.2rem;
        font-size: 0.8rem;
      }
      .top-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.4rem;
      }
      .bottom-header {
        justify-content: center;
      }
      .search-wrap input {
        width: 80px;
      }
      .hero-carousel {
        height: calc(100vh - 280px);
        min-height: 320px;
        max-height: 600px;
      }
      .carousel-btn {
        width: 36px;
        height: 36px;
        font-size: 0.9rem;
      }
    }

    @media screen and (max-width: 480px) {
      .main-menu {
        gap: 0.8rem;
        font-size: 0.7rem;
      }
      .brand h1 {
        font-size: 1.3rem;
      }
      .offer-banner {
        font-size: 0.65rem;
        padding: 0.2rem 0.4rem;
        gap: 0.2rem;
      }
      .offer-banner span {
        padding: 0.05rem 0.4rem;
        font-size: 0.65rem;
      }
      .offer-banner strong {
        font-size: 0.7rem;
      }
      .hero-carousel {
        height: calc(100vh - 260px);
        min-height: 260px;
        max-height: 450px;
      }
      .carousel-controls {
        bottom: 1rem;
        gap: 0.8rem;
      }
      .carousel-btn {
        width: 32px;
        height: 32px;
        font-size: 0.75rem;
      }
      .dot {
        width: 7px;
        height: 7px;
      }
      .dot.active {
        width: 18px;
      }
      .search-wrap input {
        width: 60px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- ===== OFFER BANNER (lightweight, professional, refined) ===== -->
  <div class="offer-banner">
    <i class="fas fa-tag" style="color:#a67c6b;"></i>
    <strong>OFFER</strong>
    <span class="highlight">UP TO 30% OFF</span>
    <i class="fas fa-circle sep" style="font-size:0.3rem; color:#d6c9c0;"></i>
    <span>NEW SEASON</span>
    <i class="fas fa-circle sep" style="font-size:0.3rem; color:#d6c9c0;"></i>
    <span>ETHNIC WEAR</span>
  </div>

  <!-- ========== HEADER 1 : TOP (simplified, professional) ========== -->
  <header class="top-header">
    <div class="brand">
      <span class="brand-icon"><i class="fas fa-crown"></i></span>
      <h1>Vianta<span>Saree</span></h1>
    </div>
    <div class="top-icons">
      <!-- search embedded -->
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search..." />
      </div>
      <i class="fas fa-user-circle"></i>
      <i class="fas fa-heart"></i>
      <i class="fas fa-shopping-bag"></i>
    </div>
  </header>

  <!-- ========== HEADER 2 : BOTTOM (menu CENTERED) ========== -->
  <header class="bottom-header">
    <nav class="main-menu">
      <a href="#">HOME</a>
      <a href="#">LEHENGA</a>
      <a href="#">BEST SELLING</a>
      <a href="#">ALL PRODUCTS</a>
      <a href="#">COTTON SAREE</a>
      <a href="#">KANJIVERAM SILK</a>
      <span class="more-dropdown">
        More <i class="fas fa-chevron-down"></i>
      </span>
    </nav>
  </header>

  <!-- ========== HERO : FULL COVER CAROUSEL (image full view) ========== -->
  <section class="hero-carousel">
    <div class="carousel-container" id="carouselContainer">
      <!-- slide 1 -->
      <div class="carousel-slide active-slide" data-index="0">
        <div class="slide-content">
          <div class="slide-image">
            <img src="https://vianta-demo.aamir68599.workers.dev/Izhaiyinsouthsilkimage%201.webp" alt="South Silk" />
          </div>
        </div>
      </div>

      <!-- slide 2 -->
      <div class="carousel-slide" data-index="1">
        <div class="slide-content">
          <div class="slide-image">
            <img src="https://vianta-demo.aamir68599.workers.dev/Maheshwari%20image.webp" alt="Maheshwari Silk" />
          </div>
        </div>
      </div>

      <!-- slide 3 -->
      <div class="carousel-slide" data-index="2">
        <div class="slide-content">
          <div class="slide-image">
            <img src="https://vianta-demo.aamir68599.workers.dev/Maheshwari%20image%202.webp" alt="Maheshwari Silk 2" />
          </div>
        </div>
      </div>

      <!-- slide 4 -->
      <div class="carousel-slide" data-index="3">
        <div class="slide-content">
          <div class="slide-image">
            <img src="https://vianta-demo.aamir68599.workers.dev/Maheshwari%20image%203.webp" alt="Maheshwari Silk 3" />
          </div>
        </div>
      </div>
    </div>

    <!-- carousel controls overlay -->
    <div class="carousel-controls">
      <button class="carousel-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
      <div class="carousel-indicators">
        <button class="dot active" data-index="0"></button>
        <button class="dot" data-index="1"></button>
        <button class="dot" data-index="2"></button>
        <button class="dot" data-index="3"></button>
      </div>
      <button class="carousel-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
    </div>
  </section>

  <!-- small note (optional) -->
  <div style="text-align: right; font-size: 0.7rem; color: #b7a69b; margin-top: 0.4rem; padding-right: 0.2rem;">
    <i class="fas fa-image"></i> 4 images · full view (no crop) · auto-slide
  </div>
</div>

<script>
  (function() {
    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.dot');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    let currentIndex = 0;
    const totalSlides = slides.length;
    let autoSlideInterval = null;
    const AUTO_SLIDE_DELAY = 3000;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.remove('active-slide');
      });
      if (slides[index]) {
        slides[index].classList.add('active-slide');
      }
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
      currentIndex = index;
    }

    function nextSlide() {
      const newIndex = (currentIndex + 1) % totalSlides;
      showSlide(newIndex);
    }
    function prevSlide() {
      const newIndex = (currentIndex - 1 + totalSlides) % totalSlides;
      showSlide(newIndex);
    }

    function startAutoSlide() {
      if (autoSlideInterval) clearInterval(autoSlideInterval);
      autoSlideInterval = setInterval(nextSlide, AUTO_SLIDE_DELAY);
    }

    function resetAutoSlide() {
      if (autoSlideInterval) {
        clearInterval(autoSlideInterval);
        autoSlideInterval = null;
      }
      startAutoSlide();
    }

    nextBtn.addEventListener('click', function() {
      nextSlide();
      resetAutoSlide();
    });
    prevBtn.addEventListener('click', function() {
      prevSlide();
      resetAutoSlide();
    });

    dots.forEach((dot) => {
      dot.addEventListener('click', function() {
        const index = parseInt(this.getAttribute('data-index'), 10);
        if (!isNaN(index) && index !== currentIndex) {
          showSlide(index);
          resetAutoSlide();
        }
      });
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight') {
        nextSlide();
        resetAutoSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
        resetAutoSlide();
      }
    });

    showSlide(0);
    startAutoSlide();
  })();
</script>

<!-- footer hint -->
<div style="max-width:1440px; width:100%; margin-top: 1rem; padding: 0.2rem 2rem; font-size: 0.75rem; color: #aa9b91; border-top: 1px solid #efe8e2; text-align: center; background: #fcf8f5; border-radius: 30px;">
  <i class="fas fa-info-circle"></i> Vianta Saree · clean header · lightweight offer · menu centered
</div>
</body>
</html>
